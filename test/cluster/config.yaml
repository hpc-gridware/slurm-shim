# slurm-shim config for the OCS test cluster (quickinstall openSUSE 15.6).
# Installed at /etc/slurm-shim/config.yaml on every node by install-shim.sh.
#
# The cluster ships one queue (all.q) and one PE (make, round-robin, control_slaves
# TRUE). Both demo partitions map onto them; the gpu partition additionally relies
# on the fake RSMAP complex install-shim.sh configures.

launcher: qrsh-inherit          # real GE tight integration on this cluster

default_partition: batch        # sbatch without -p lands here (like SLURM's DEFAULT)

partitions:
  batch: {queue: all.q, pe: make, slots: "per-task"}
  gpu:   {queue: all.q, pe: make, slots: "per-task"}

pes:
  make: {task_policy: slot}     # one task per granted slot (srun -n defaults to slots)

gpu:
  discovery: qstat-gres         # RSMAP grant -> per-rank CUDA_VISIBLE_DEVICES
  isolation: shim
  gres_complex: gpu

memory_complex: h_vmem
export_master_addr: true        # publish MASTER_ADDR/MASTER_PORT for the demos
