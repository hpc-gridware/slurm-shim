name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Build and test on both platforms. Linux exercises the _linux.go syscall
  # paths (affinity, Pdeathsig); macOS is the primary development platform and
  # must stay green via the no-op fallbacks.
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: make build
      - run: make vet
      - run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # Build golangci-lint from source with the repo's Go toolchain so its build
      # Go version is always >= the module's go directive (the prebuilt action
      # binaries lag behind, breaking on go 1.25 modules). v2.11.2 matches local.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.2
      - run: golangci-lint run ./...

  # Module hygiene gate (go.mod/go.sum stay tidy). The requirement-traceability
  # gate (make trace) runs locally only, since tools/ and docs/specs/ are not
  # published.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: make tidy-check
