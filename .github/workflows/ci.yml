name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Build and test on both platforms. Linux exercises the _linux.go syscall
  # paths (affinity, Pdeathsig); macOS is the primary development platform and
  # must stay green via the no-op fallbacks.
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: make build
      - run: make vet
      - run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin BOTH sides. golangci-lint typechecks through its own x/tools, which
      # only reads export data from Go releases it predates: a runner Go newer
      # than the linter fails on every stdlib import ("export data version N is
      # greater than maximum supported"), while a linter older than the module's
      # go directive fails the other way. `stable` moves on its own, so pairing
      # it with a pinned linter breaks on each Go release. This pair is the one
      # verified green; bump them together.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.2
      - run: golangci-lint run ./...

  # Module hygiene gate (go.mod/go.sum stay tidy). The requirement-traceability
  # gate (make trace) runs locally only, since tools/ and docs/specs/ are not
  # published.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: make tidy-check
